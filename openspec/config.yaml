schema: spec-driven-adr

context: |
  Rust (tokio/axum/reqwest/serde) single-binary LLM gateway. Successor to the Node.js
  modelrelay fork (gschaetz/modelrelay, stays as LTS); provide a one-time `migrate-modelrelay` command
  (never a runtime reader of ~/.modelrelay.json); migrated configs reference API keys by env var.
  Request pipeline order is fixed: budget/cost middleware -> NVIDIA NeMo Switchyard
  (switchyard-libsy, in-process) -> modelrelay-style provider dispatch.
  Cost tracking must stay off the streaming critical path (mpsc -> async writer -> SQLite).
  Accept OpenAI and Anthropic protocols inbound; OpenAI-compatible outbound.
rules:
  design:
    - When a change touches authentication, a network listener, secrets, the admin surface, or the parsing of untrusted data (from a client, a provider or an external source), design.md must include a "Threat model" section covering the assets and actors involved, the trust boundaries it crosses, and a table of threats, each with its mitigation and the test or invariant that proves it. Name any threat that has no mitigation as a gap instead of leaving it out. See docs/threat-model.md.
  tasks:
    - When a change alters structure, request flow or component status, include a task to update docs/architecture.md and verify its Mermaid diagrams still match the code
    - When a design has a threat model, include a task to check it against what was built (each row still true, each proof exists), and update docs/threat-model.md when a trust boundary or a gap changed
    - "When a design names the serving runtime, the ledger pool, the writer's queue or the CPU allowance as something the change uses or adds work to, include a performance task: a before and after measurement, or a run of the isolation test, recorded in docs/performance.md. See docs/fitness-functions.md and ADR 0036."
    - "When a change adds a module under src/ or a performance or architecture check, include a task to update fitness/register.toml and docs/fitness-functions.md (a module's class, a check's triggers and cadence); tests/architecture.rs fails until they agree."
# Project context (optional)
# Add only constraints that should guide OpenSpec artifacts and workflows.
# Include constraints an agent cannot infer by reading the code.
# Keep general project documentation and discoverable codebase facts out.
# Example:
#   context: |
#     Designs and tasks must cover Windows, macOS, and Linux
#     Write all artifacts in Spanish

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
# Example:
#   rules:
#     proposal:
#       - Keep proposals under 500 words
#       - Always state what is out of scope
#     tasks:
#       - Break tasks into chunks of max 2 hours

# Per-operation guidance (optional)
# Add advisory guidance for how apply and archive work should be conducted.
# This is separate from artifact rules above.
# Example:
#   operations:
#     apply:
#       guidance:
#         - Keep test summaries concise
#     archive:
#       guidance:
#         - Summarize the archive outcome before finishing
