[package]
name = "switchyard-conductor"
version = "0.1.0"
edition = "2024"
rust-version = "1.96.1"

[dependencies]
async-stream = "0.3.6"
axum = "0.8.9"
bytes = "1.12.1"
clap = { version = "4.6.7", features = ["derive"] }
futures = "0.3.34"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls", "stream"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
switchyard-protocol = "0.3.0"
switchyard-translation = "0.3.0"
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["full"] }
toml = "1.1.6"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"

[dev-dependencies]
http-body-util = "0.1.5"
tower = "0.5.3"
