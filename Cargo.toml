[package]
name = "humpyard"
version = "0.1.0"
edition = "2024"
rust-version = "1.96.1"
description = "A gateway that sorts each LLM request onto the right model: protocol translation, Switchyard routing, failover and budgets"
license = "Apache-2.0"
repository = "https://github.com/gschaetz/humpyard"
homepage = "https://humpyard.dev"
readme = "README.md"

[dependencies]
async-stream = "0.3.6"
async-trait = "0.1.92"
axum = "0.8.9"
bytes = "1.12.1"
clap = { version = "4.6.7", features = ["derive"] }
futures = "0.3.34"
getrandom = "0.4.3"
hex = "0.4.3"
http = "1.5.0"
parking_lot = "0.12.5"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls", "stream"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "sqlite"] }
switchyard-libsy = "0.3.0"
switchyard-llm-client = "0.3.0"
switchyard-protocol = "0.3.0"
switchyard-translation = "0.3.0"
thiserror = "2.0.21"
time = "0.3.55"
tokio = { version = "1.53.2", features = ["full"] }
toml = "1.1.6"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
http = "1.5.0"
http-body-util = "0.1.5"
parking_lot = "0.12.5"
tempfile = "3.27.0"
tower = "0.5.3"
