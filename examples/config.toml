listen = "127.0.0.1:8080"
# shutdown_grace_secs = 30   # how long to let in-flight requests finish after SIGTERM/Ctrl-C (0-3600)

# Providers: OpenAI-compatible endpoints. Keys come from environment variables only.
[providers.groq]
base_url = "https://api.groq.com/openai/v1"
api_key_env = "GROQ_API_KEY"
timeout_secs = 120
max_retries = 1          # extra attempts on this provider before failing over
# headers = { "x-app" = "conductor" }   # optional static headers on every call

[providers.openrouter]
base_url = "https://openrouter.ai/api/v1"
api_key_env = "OPENROUTER_API_KEY"

# Targets: a named model served by an ordered list of endpoints (failover order).
[targets.fast]
endpoints = [
  { provider = "groq", model = "llama-3.3-70b-versatile" },
  { provider = "openrouter", model = "meta-llama/llama-3.3-70b-instruct" },
]

[targets.smart]
endpoints = [{ provider = "openrouter", model = "anthropic/claude-sonnet-4.5" }]

# Routes: what clients request as `model`. Types: passthrough, random, stage_router, llm_classifier.
[routes.auto]
type = "stage_router"
efficient = ["fast"]
capable = ["smart"]
mode = "efficient_first"
confidence_threshold = 0.5

# Any route can limit which failures move on to the next target (default: all of them):
# fallback_on = ["overflow"]   # classes: overflow, rate_limit, timeout, server_error, connection, forbidden

# An escalation route additionally needs a judge target:
# [routes.agent]
# type = "llm_classifier"
# mode = "escalation"      # or "capability"
# efficient = ["fast"]
# capable = ["smart"]
# judge = ["fast"]

# Endpoint health (all optional; these are the defaults). After `failure_threshold` consecutive
# failures an endpoint is skipped for `cooldown_secs` (doubling each time, up to
# `max_cooldown_secs`), then probed with one request. 0 turns it off.
# [health]
# failure_threshold = 3
# cooldown_secs = 30
# max_cooldown_secs = 300
