# Dependency policy, checked in CI by `cargo deny check` (see docs/invariants.md).
# A new licence, a yanked or vulnerable crate, or an unknown registry fails the build, so each is
# a conscious decision rather than an accident.

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
# Add an advisory id here only with a comment saying why it does not apply and when to revisit.
ignore = [
  # libsqlite3-sys 0.37.0 bundles SQLite before 3.54.0, which can return uninitialised page-cache memory
  # when a process opens a database together with a -wal file a less trusted party wrote. The only database
  # humpyard opens is its own ledger (src/ledger.rs), at a path from the operator's configuration, in a
  # directory only the gateway writes. The fix is libsqlite3-sys >= 0.39, but sqlx 0.9.0 (the latest) pins 0.37.
  # Revisit when a sqlx release allows libsqlite3-sys 0.39 or later, then remove this entry.
  { id = "RUSTSEC-2026-0459" },
]

[licenses]
version = 2
# Permissive licences only. Copyleft (GPL, AGPL, LGPL-only, MPL) is deliberately absent: this
# project is Apache-2.0 and ships as a single binary. SPDX `OR` expressions pass if any branch
# is allowed (for example r-efi offers MIT or Apache-2.0 alongside LGPL).
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
  "MIT-0",
  "Unlicense",
  "CC0-1.0",
  "BSL-1.0",
  "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9

[bans]
# Two versions of a crate are tolerated (Switchyard pins some of ours) but surfaced.
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
