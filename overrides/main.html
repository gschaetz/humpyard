{% extends "base.html" %}

{% block extrahead %}
  {{ super() }}
  {#- Link previews (Discord, Slack, X, LinkedIn). The image is the 1280x640 social preview. -#}
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="humpyard">
  <meta property="og:title" content="{% if page and page.title and not page.is_homepage %}{{ page.title }} - humpyard{% else %}humpyard: sorts each LLM request onto the right model{% endif %}">
  <meta property="og:description" content="{% if page and page.meta and page.meta.description %}{{ page.meta.description }}{% else %}{{ config.site_description }}{% endif %}">
  <meta property="og:image" content="https://humpyard.dev/assets/social-preview.png">
  <meta property="og:image:width" content="1280">
  <meta property="og:image:height" content="640">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:image" content="https://humpyard.dev/assets/social-preview.png">
{% endblock %}
