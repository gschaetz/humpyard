site_name: humpyard
site_description: A content-aware routing and policy gateway for agent LLM traffic.
site_url: https://humpyard.dev
repo_name: gschaetz/humpyard
repo_url: https://github.com/gschaetz/humpyard
edit_uri: edit/main/docs/
# site/prepare.py assembles the input here (links that leave docs/ become GitHub links, and the
# example configs become a page). CI builds with --strict.
docs_dir: build/docs

theme:
  name: material
  custom_dir: overrides       # link-preview meta tags (overrides/main.html)
  logo: assets/humpyard-mark.svg
  favicon: assets/favicon.svg

  palette:
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode

  features:
    - navigation.tabs          # horizontal top tabs for the main categories
    - navigation.tabs.sticky   # keep the tab row visible while scrolling
    - navigation.sections      # group pages inside the sidebar
    - navigation.top           # floating back-to-top button
    - navigation.tracking      # URL follows the section being read
    - navigation.instant       # no-refresh page loads
    - search.suggest           # inline search completions
    - search.highlight         # highlight the searched words on the page
    - content.code.copy        # copy button on code blocks
    - content.code.annotate    # numbered callouts inside code blocks

  font: false                  # system fonts (set in extra.css): no Google Fonts request

  icon:
    repo: fontawesome/brands/github

markdown_extensions:
  - admonition
  - tables                     # the docs use tables heavily
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid        # the architecture page has mermaid diagrams
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

plugins:
  - search

extra_css:
  - stylesheets/extra.css

nav:
  - Home: index.md
  - Using it:
      - Try it in a minute: demo.md
      - Deployment: deployment.md
      - Configuration: configuration.md
      - Clients: clients.md
      - Routing: routing.md
      - Keys, budgets and the ledger: budgets.md
      - API and endpoints: api.md
      - Looking at a running gateway (ctl): ctl.md
      - Metrics and alerts: metrics.md
      - Providers: providers.md
      - Keeping pools current: discovery.md
      - Performance and scale: performance.md
      - Cut agent costs: cut-agent-costs.md
      - Compared with other gateways: compare.md
      - Migrating from LiteLLM: migrating-from-litellm.md
      - Moving from ModelRelay: migrating-from-modelrelay.md
      - Example configs: examples.md
  - Design:
      - Roadmap: roadmap.md
      - Architecture: architecture.md
      - Invariants: invariants.md
      - Background: background.md
      - Decision records:
          - Index: adr/README.md
          - "0001 Embed Switchyard in process": adr/0001-embed-switchyard-in-process.md
          - "0002 Dispatch on Switchyard's client": adr/0002-dispatch-on-switchyards-client.md
          - "0003 Config-first keys": adr/0003-config-first-virtual-keys-behind-keystore.md
          - "0004 No plaintext secrets": adr/0004-no-plaintext-secrets.md
          - "0005 SQLite ledger": adr/0005-sqlite-ledger-with-async-writer.md
          - "0006 Money as integer micro-USD": adr/0006-money-as-integer-micro-usd.md
          - "0007 One-shot modelrelay migration": adr/0007-one-shot-modelrelay-migration.md
          - "0008 Routing policy seam": adr/0008-routing-policy-seam.md
          - "0009 Endpoint health": adr/0009-endpoint-health-lives-in-the-pool.md
          - "0010 Tag-only releases": adr/0010-tag-only-native-releases.md
          - "0011 Selectors": adr/0011-selectors-choose-the-route.md
          - "0012 Config reload": adr/0012-config-snapshot-reloaded-on-sighup.md
          - "0013 Decision log": adr/0013-decisions-recorded-per-request.md
          - "0014 Price import": adr/0014-prices-are-proposed-never-fetched-at-runtime.md
          - "0015 Provider quota": adr/0015-provider-quota-is-polled-advisory-and-fails-open.md
          - "0016 Metrics, one registry": adr/0016-metrics-are-one-registry-with-bounded-labels.md
          - "0017 Strict routes": adr/0017-strict-routes-exclude-disallowed-classes-before-routing.md
          - "0018 Cold targets": adr/0018-cold-targets-are-skipped-only-when-an-alternative-remains.md
          - "0019 Capabilities": adr/0019-declared-capabilities-remove-targets-that-cannot-serve-a-request.md
