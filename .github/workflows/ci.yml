name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.99"
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  # Every commit in a pull request must carry a DCO `Signed-off-by` line (CONTRIBUTING.md).
  # Merge commits are exempt: they are created by GitHub or by `git merge`, not authored.
  dco:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Check sign-offs
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          missing=0
          for commit in $(git rev-list --no-merges "$BASE..$HEAD"); do
            if ! git log -1 --format=%B "$commit" | grep -Eq '^Signed-off-by: .+ <.+@.+>$'; then
              echo "::error::commit $(git log -1 --format='%h %s' "$commit") has no Signed-off-by line"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Sign off with 'git commit -s', or amend existing commits with 'git rebase --signoff origin/main'."
            exit 1
          fi

  # Licences, advisories, yanked crates and registries (deny.toml).
  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  # Public and private docs must build without warnings (broken links, bad markup).
  docs:
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.99"
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --no-deps --all-features --document-private-items

  # The declared minimum supported Rust version (Cargo.toml `rust-version`) must still build.
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.96.1"
      - uses: Swatinem/rust-cache@v2
      # The explicit `+toolchain` overrides rust-toolchain.toml, which pins the newer dev compiler.
      - run: cargo +1.96.1 check --all-targets --locked

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.99"
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-llvm-cov
      # Floor set a few points under the first measured baseline (96.15% lines on 2026-10-07).
      # It only ratchets up: raise it when coverage rises, never lower it to make a change pass.
      - name: Line coverage (floor 92%)
        run: cargo llvm-cov --summary-only --fail-under-lines 92

  # The container image must keep building (it is published by the release workflow).
  image:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
