name: ci
on:
  push:
    branches: [main]
    # A release tag runs every registered check (fitness/register.toml); the release workflow does not wait for it.
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  pull_request:
  # Weekly on main (Monday, 05:17 UTC): a path map misses a dependency's behaviour and slow drift.
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:
    inputs:
      rehearse_failure:
        description: "Make the isolation job fail after it has run and report as the weekly run would (opens or comments on a performance-regression issue; close it afterwards)"
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # Full debug info for every test binary fills the runner's disk (about 14 GB free); line tables keep
      # backtraces and cost a fraction of the space. A failed link with "Bus error" or a build with "No space left
      # on device" is this, not the code.
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.99"
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - name: Disk left
        if: always()
        run: df -h /

  # Every commit in a pull request must carry a DCO `Signed-off-by` line (CONTRIBUTING.md).
  # Merge commits are exempt: they are created by GitHub or by `git merge`, not authored.
  dco:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Check sign-offs
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          missing=0
          for commit in $(git rev-list --no-merges "$BASE..$HEAD"); do
            if ! git log -1 --format=%B "$commit" | grep -Eq '^Signed-off-by: .+ <.+@.+>$'; then
              echo "::error::commit $(git log -1 --format='%h %s' "$commit") has no Signed-off-by line"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Sign off with 'git commit -s', or amend existing commits with 'git rebase --signoff origin/main'."
            exit 1
          fi

  # Licences, advisories, yanked crates and registries (deny.toml).
  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  # Public and private docs must build without warnings (broken links, bad markup).
  docs:
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.99"
      - uses: Swatinem/rust-cache@v2
      # No `--all-features`: the `ui` feature embeds the built GUI and fails without it, and nothing it adds is
      # documented differently.
      - run: cargo doc --no-deps --document-private-items

  # The declared minimum supported Rust version (Cargo.toml `rust-version`) must still build.
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.96.1"
      - uses: Swatinem/rust-cache@v2
      # The explicit `+toolchain` overrides rust-toolchain.toml, which pins the newer dev compiler.
      - run: cargo +1.96.1 check --all-targets --locked

  coverage:
    runs-on: ubuntu-latest
    env:
      # Instrumented test binaries are the largest build of the pipeline; see the note on the check job.
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.99"
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-llvm-cov
      # Floor set a few points under the first measured baseline (96.15% lines on 2026-10-07).
      # It only ratchets up: raise it when coverage rises, never lower it to make a change pass.
      - name: Line coverage (floor 92%)
        run: cargo llvm-cov --summary-only --fail-under-lines 92
      - name: Disk left
        if: always()
        run: df -h /

  # The admin GUI (ui/, ADR 0032). The generated client must match docs/openapi/admin-v1.json, so a contract change
  # that the GUI has not followed fails here. Dependencies install without running their scripts. `dist` is what
  # the release builds embed.
  ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci --ignore-scripts
      - name: The generated client matches the contract
        run: npm run check:generated
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run audit
      - uses: actions/upload-artifact@v4
        with:
          name: ui-dist
          path: ui/dist
          if-no-files-found: error

  # The container image must keep building (it is published by the release workflow).
  image:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: humpyard:ci
      - name: The image's binary carries the GUI
        run: |
          docker create --name humpyard-ci humpyard:ci
          docker cp humpyard-ci:/usr/local/bin/humpyard ./humpyard-from-image
          scripts/smoke-ui.sh ./humpyard-from-image

  # Which registered checks (fitness/register.toml, docs/fitness-functions.md) this run needs. A pull request or a
  # push to main gets the checks its changed files trigger; the weekly run, a manual dispatch and a release tag get
  # every check that runs on a hosted runner.
  changes:
    runs-on: ubuntu-latest
    outputs:
      checks: ${{ steps.select.outputs.checks }}
      jobs: ${{ steps.select.outputs.jobs }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: select
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          REF: ${{ github.ref }}
        run: |
          base=""
          if [ "$EVENT" = pull_request ]; then
            base="$PR_BASE"
          elif [ "$EVENT" = push ] && [ "${REF#refs/tags/}" = "$REF" ] && ! echo "$PUSH_BEFORE" | grep -Eq '^0+$'; then
            base="$PUSH_BEFORE"
          fi
          if [ -n "$base" ]; then
            checks=$(python3 -I scripts/select-checks.py "$base" | tr '\n' ' ')
            jobs=$(python3 -I scripts/select-checks.py "$base" --jobs | tr '\n' ' ')
          else
            checks=$(python3 -I scripts/select-checks.py --all | tr '\n' ' ')
            jobs=$(python3 -I scripts/select-checks.py --all --jobs | tr '\n' ' ')
          fi
          echo "checks=$checks" >> "$GITHUB_OUTPUT"
          echo "jobs=$jobs" >> "$GITHUB_OUTPUT"
          echo "Selected checks: ${checks:-none}" >> "$GITHUB_STEP_SUMMARY"

  # The isolation tests (tests/isolation.rs, ADR 0036) in release mode: administrative reads and a large prune must
  # not move the request path. Heavy, so only when selected.
  isolation:
    needs: changes
    if: contains(needs.changes.outputs.jobs, 'isolation')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.99"
      - uses: Swatinem/rust-cache@v2
      # A hosted runner is a shared machine: a neighbour or a disk stall can move one run. A real regression moves
      # every run, so a failure is run once more, and passes only if the second run passes too; the first failure
      # stays in the log and as a warning.
      - name: Isolation tests
        run: |
          cargo test --release --test isolation -- --ignored --nocapture || {
            echo "::warning::the isolation tests failed once and were run again"
            cargo test --release --test isolation -- --ignored --nocapture
          }
      - name: Rehearsal of a failed weekly run
        if: github.event_name == 'workflow_dispatch' && inputs.rehearse_failure
        run: |
          echo "::error::rehearsal: failing on purpose so the report step can be checked"
          exit 1

  # The one required result. It always runs, so a job that selection skipped never leaves a required check
  # waiting; it fails when a job that ran failed or was cancelled (or the selection itself did not run).
  performance-gate:
    if: always()
    needs: [changes, check, isolation]
    runs-on: ubuntu-latest
    steps:
      - env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | python3 -c '
          import json, sys
          needs = json.load(sys.stdin)
          bad = {n: v["result"] for n, v in needs.items() if v["result"] not in ("success", "skipped")}
          for name, result in needs.items():
              print(f"{name}: {result}")
          if needs["changes"]["result"] != "success":
              bad["changes"] = needs["changes"]["result"]
          if bad:
              print("failed: " + ", ".join(f"{n} ({r})" for n, r in bad.items()))
              sys.exit(1)
          '

  # A failed weekly run opens an issue, or comments on the one that is open; it never closes it. Pull-request
  # runs and ordinary dispatches never get here. The only permission is to write issues.
  report-weekly-failure:
    if: always() && needs.performance-gate.result == 'failure' && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.rehearse_failure))
    needs: [performance-gate, changes]
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          CHECKS: ${{ needs.changes.outputs.checks }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EVENT: ${{ github.event_name }}
        run: |
          prefix=""
          [ "$EVENT" = workflow_dispatch ] && prefix="Rehearsal: "
          body="${prefix}The ${EVENT/schedule/weekly} run of the registered checks failed on main.

          Checks in this run: ${CHECKS}
          Run: ${RUN_URL}

          See docs/fitness-functions.md for what each check protects. A regression found this way is a reason to widen that check's triggers in fitness/register.toml. Close this issue when the cause is fixed; the workflow never closes it."
          gh label create performance-regression --color B60205 --description "A scheduled performance or architecture check failed" 2>/dev/null || true
          open=$(gh issue list --label performance-regression --state open --json number --jq '.[0].number // empty')
          if [ -n "$open" ]; then
            gh issue comment "$open" --body "$body"
          else
            gh issue create --label performance-regression --title "${prefix}Scheduled performance checks failed" --body "$body"
          fi
